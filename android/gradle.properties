org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=true

# DISABLE KOTLIN INCREMENTAL COMPILATION - This prevents cache corruption
kotlin.incremental=false
kotlin.incremental.js=false

# Disable Kotlin daemon to avoid compilation issues
kotlin.daemon.jvm.options=-Xmx2G,-XX:MaxMetaspaceSize=512m
org.gradle.daemon=false

# Build configuration
org.gradle.parallel=true
org.gradle.workers.max=2

# Disable build cache to avoid stale artifacts
org.gradle.caching=false
